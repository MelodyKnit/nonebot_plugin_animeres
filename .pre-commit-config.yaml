repos:
  - repo: https://github.com/hadialqattan/pycln
    rev: v2.6.0
    hooks:
      - id: pycln
        args: [--config, pyproject.toml]

  - repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
      - id: isort
        stages: [pre-commit]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.0
    hooks:
      - id: black
        stages: [pre-commit]